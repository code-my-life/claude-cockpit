name: Release

# A tag vX.Y.Z builds the Windows installer, then a separate job with write
# access publishes it. The build job only reads the repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: The tag matches the app version
        shell: bash
        run: test "v$(node -p "require('./desktop/package.json').version")" = "$GITHUB_REF_NAME"
      - name: Dependencies
        working-directory: desktop
        run: npm ci
      - name: Installer
        working-directory: desktop
        run: npm run dist
      - name: Checksums
        shell: bash
        working-directory: desktop/dist
        run: sha256sum *.exe > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          # latest.yml and the blockmap are what installed apps read to update themselves.
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
            desktop/dist/SHA256SUMS.txt
          retention-days: 3

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Claude Cockpit $GITHUB_REF_NAME" --notes "Installeur Windows : claude-cockpit-setup-${GITHUB_REF_NAME#v}.exe. Il n'est pas encore signé, Windows peut donc afficher « Windows a protégé votre ordinateur » : Informations complémentaires, puis Exécuter quand même. Sommes de contrôle dans SHA256SUMS.txt. Les versions installées se mettent à jour d'elles-mêmes."
