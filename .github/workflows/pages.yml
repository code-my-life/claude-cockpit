name: GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build site
        run: node site/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      
      - name: Run tests
        run: |
          TMPDIR=/tmp node --test site/test/structure.test.mjs
          npx playwright install chromium
          npx playwright install-deps chromium
          ./node_modules/.bin/playwright test site/test/visual.spec.ts
      
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
      
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4