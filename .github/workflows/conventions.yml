name: Conventions

# Each pull request's branch, title, and body follow its issue type (ADR 0017 of
# hermes-software-factory): the check lives in code-my-life/.github; this workflow only calls it.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  conventions:
    name: Conventions
    uses: code-my-life/.github/.github/workflows/conventions.yml@main
