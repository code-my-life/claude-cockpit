name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: |
          npm ci
          npm test
          npm run typecheck:mod
      - name: The tag matches the app version
        shell: bash
        run: test "v$(node -p "require('./desktop/package.json').version")" = "$GITHUB_REF_NAME"
      - name: Dependencies
        working-directory: desktop
        run: npm ci
      - name: Installer
        working-directory: desktop
        run: npm run dist
      - name: Checksums
        shell: bash
        working-directory: desktop/dist
        run: sha256sum *.exe > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
            desktop/dist/SHA256SUMS.txt
          retention-days: 3

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --repo explicite : ce job n'a pas de checkout, gh ne peut pas deviner le dépôt
          # A rerun finds the release already there: it then only replaces the files.
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" \
              --title "v${GITHUB_REF_NAME#v}" --notes "Release ${GITHUB_REF_NAME}"
          fi

  # After publish: the graph is added to the release publish created. Run in parallel, its upload created the
  # release first and publish then failed on "a release with the same tag name already exists" (v0.5.1).
  build-graph:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.target_commitish }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          activate-environment: true
          python-version: "3.12"
      # graphify pinned: its output layout changed between versions, which broke this job several times.
      - name: Install graphify
        run: uv pip install "graphifyy[openai]==0.9.91"
      # No --out: graphify always writes to ./graphify-out/. With --out X it writes to X/graphify-out/ (hidden files
      # included), which the former "mv X/graphify-out/*" could not undo (the hidden files stayed, rmdir failed).
      - name: Extract code graph (AST only)
        run: uv run graphify extract . --code-only --no-gitignore
      - name: Cluster + report
        run: uv run graphify cluster-only . --no-label
      - name: Name communities (sans nom, le graphe est illisible pour un humain)
        env:
          OPENAI_BASE_URL: https://integrate.api.nvidia.com/v1
          OPENAI_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENAI_MODEL: nvidia/nemotron-3-super-120b-a12b
        run: uv run graphify label . --backend openai --model nvidia/nemotron-3-super-120b-a12b
      # Fails here, with the reason, rather than publishing a release without its graph.
      - name: Check the graph
        run: |
          if [ ! -s graphify-out/graph.json ]; then
            echo "::error::graphify-out/graph.json is missing; graph files found:"
            find . -name 'graph.json' -not -path './node_modules/*'
            exit 1
          fi
          python3 -c "import json, sys; g = json.load(open('graphify-out/graph.json')); n = len(g.get('nodes', [])); print(f'{n} nodes'); sys.exit(0 if n > 0 else 'graph.json has no node')"
      - name: Upload graph as release asset
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" graphify-out/graph.json --repo "${GITHUB_REPOSITORY}" --clobber

  trigger-global-graph:
    needs: build-graph
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Dispatch to code-graph
        uses: peter-evans/repository-dispatch@v3
        with:
          repository: code-my-life/code-graph
          event-type: repo-released
          client-payload: '{"repo": "${{ github.repository }}", "tag": "${{ github.ref_name }}"}'
