name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: |
          npm ci
          npm test
          npm run typecheck:mod
      - name: The tag matches the app version
        shell: bash
        run: test "v$(node -p "require('./desktop/package.json').version")" = "$GITHUB_REF_NAME"
      - name: Dependencies
        working-directory: desktop
        run: npm ci
      - name: Installer
        working-directory: desktop
        run: npm run dist
      - name: Checksums
        shell: bash
        working-directory: desktop/dist
        run: sha256sum *.exe > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
            desktop/dist/SHA256SUMS.txt
          retention-days: 3

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --repo explicite : ce job n'a pas de checkout, gh ne peut pas deviner le dépôt
          gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" \
            --title "v${GITHUB_REF_NAME#v}" --notes "Release ${GITHUB_REF_NAME}"

  build-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.target_commitish }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          activate-environment: true
          python-version: "3.12"
      - name: Install graphify
        run: uv pip install "graphifyy[openai]"
      - name: Extract code graph (AST only)
        run: |
          uv run graphify extract . --code-only --out graphify-out --no-gitignore
      - name: Cluster + report
        run: |
          uv run graphify cluster-only graphify-out --no-label
          # graphify écrit parfois dans <out>/graphify-out/ : on normalise sur graphify-out/graph.json
          [ -f graphify-out/graph.json ] || { mv graphify-out/graphify-out/* graphify-out/ && rmdir graphify-out/graphify-out; }
      - name: Name communities (sans nom, le graphe est illisible pour un humain)
        env:
          OPENAI_BASE_URL: https://integrate.api.nvidia.com/v1
          OPENAI_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENAI_MODEL: nvidia/nemotron-3-super-120b-a12b
        run: uv run graphify label . --backend openai --model nvidia/nemotron-3-super-120b-a12b
      - name: Upload graph as release asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: graphify-out/graph.json

  trigger-global-graph:
    needs: [publish, build-graph]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Dispatch to code-graph
        uses: peter-evans/repository-dispatch@v3
        with:
          repository: code-my-life/code-graph
          event-type: repo-released
          client-payload: '{"repo": "${{ github.repository }}", "tag": "${{ github.ref_name }}"}'
