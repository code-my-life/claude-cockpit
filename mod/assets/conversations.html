    return [keyOf(element), { left: box.left, top: box.top }];
  }));

  const animateMoves = (before, changedIds) => {
    if (!state.hasRendered || prefersCalm()) return;
    for (const element of movableElements()) {
      const key = keyOf(element);
      const previous = before.get(key);
      const box = element.getBoundingClientRect();
      if (previous === undefined) {
        element.animate([{ opacity: 0, transform: 'translateY(8px) scale(0.98)' }, { opacity: 1, transform: 'none' }], { duration: 280, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
        continue;
      }
      const dx = previous.left - box.left;
      const dy = previous.top - box.top;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
        element.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 360, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
      }
      const engineId = element.dataset.engine;
      if (engineId && changedIds.has(engineId)) element.classList.add('changed');
    }
  };

  const statusChanges = () => {
    const changed = new Set();
    for (const row of state.data.rows) {
      const previous = state.lastStatus.get(row.engineId);
      if (previous !== undefined && previous !== row.status) changed.add(row.engineId);
      state.lastStatus.set(row.engineId, row.status);
    }
    return changed;
  };

  const focusPendingDraft = () => {
    if (!state.focusDraft) return;
    const textarea = document.querySelector(`[data-engine="${state.focusDraft}"] textarea[data-role="draft"]`);
    if (textarea) {
      textarea.focus({ preventScroll: true });
      textarea.setSelectionRange(textarea.value.length, textarea.value.length);
    }
    state.focusDraft = null;
  };

  const render = ({ force = false } = {}) => {
    const key = renderKey();
    if (!force && key === state.lastRenderedKey) return;
    if (!force && isTyping()) return;
    state.lastRenderedKey = key;
    if (isMini) {
      renderMiniFrame(Date.now());
      return;
    }
    const scroll = captureScroll();
    const positions = capturePositions();
    const changedIds = statusChanges();
    const now = Date.now();
    const groups = groupRows();
    let offset = 0;
    for (const row of [...groups.waiting, ...groups.working, ...groups.parked]) state.shownOrder.set(row.engineId, offset++);

    const avatars = [...groups.waiting.map(row => renderAvatar(row, 'waiting')), ...groups.working.map(row => renderAvatar(row, 'working'))];
    document.getElementById('crew').innerHTML = avatars.join('');

    document.getElementById('n-waiting').textContent = groups.waiting.length;
    const waitingCards = groups.waiting.map(row => renderWaitingCard(row, now)).join('');
    document.querySelector('#s-waiting .lane').innerHTML = groups.waiting.length === 0 ? renderEmpty() : waitingCards;

    document.getElementById('n-working').textContent = groups.working.length;
    document.getElementById('s-working').style.display = groups.working.length === 0 ? 'none' : '';
    document.querySelector('#s-working .lane').innerHTML = groups.working.map(row => renderMissionRow(row, now)).join('');

    document.getElementById('n-parked').textContent = groups.parked.length;
    document.getElementById('s-parked').style.display = groups.parked.length === 0 ? 'none' : '';
    document.querySelector('#s-parked .lane').innerHTML = groups.parked.map(row => renderParkedRow(row, now)).join('');

    const restToggle = document.getElementById('rest-toggle');
    restToggle.textContent = `${state.othersOpen ? 'Masquer les' : 'Voir les'} ${groups.others.length} agents au repos`;
    restToggle.setAttribute('aria-expanded', String(state.othersOpen));
    document.getElementById('s-others').style.display = groups.others.length === 0 ? 'none' : '';
    document.getElementById('rest-list').innerHTML = state.othersOpen ? groups.others.map(row => renderRestRow(row, now)).join('') : '';

    renderDayStats();
    if (state.view === 'team') renderTeam(now);
    else document.getElementById('team').innerHTML = '';

    document.title = groups.waiting.length > 0 ? `(${groups.waiting.length}) Ton équipe` : 'Ton équipe';
    restoreScroll(scroll);
    animateMoves(positions, changedIds);
    state.hasRendered = true;

    focusPendingDraft();
  };

  const renderStats = ({ bump = false } = {}) => {
    const stats = readStats();
    const counter = document.getElementById('relaunched');
    counter.textContent = stats.relaunched;
    document.getElementById('record').textContent = Math.max(stats.record, stats.relaunched);
    if (!bump) return;
    counter.classList.remove('bump');
    void counter.offsetWidth;
    counter.classList.add('bump');
  };

  const tickAges = () => {
    const now = Date.now();
    for (const element of document.querySelectorAll('.mrow-age[data-updated], .rest-age[data-updated], .park-age[data-updated]')) {
      element.textContent = formatAge(Number(element.dataset.updated), now);
    }
    for (const pill of document.querySelectorAll('.age-pill[data-updated]')) {
      const bonus = ageBonus({ updatedAt: Number(pill.dataset.updated) }, now);
      pill.textContent = bonus.label;
      pill.style.background = bonus.bg;
      pill.style.color = bonus.fg;
    }
    const freshness = document.getElementById('freshness');
    if (state.data.generatedAt === 0) {
      freshness.textContent = 'aucune donnée : ouvre une conversation Claude avec le mod';
      freshness.classList.add('stale');
      return;
    }
    const age = now - state.data.generatedAt;
    const hasWorkers = state.data.rows.some(row => ACTIVE_STATUSES.includes(row.status));
    freshness.textContent = `dernier changement il y a ${formatAge(state.data.generatedAt, now)}`;
    freshness.classList.toggle('stale', age > STALE_AFTER_MS && hasWorkers);
  };

  const tickClock = () => {
    const now = new Date();
    document.getElementById('clock').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  };

  const showReward = (badge, text, variant = '') => {
    for (const old of document.querySelectorAll('.reward')) old.remove();
    const reward = document.createElement('div');
    reward.className = `reward ${variant}`;
    reward.setAttribute('role', 'status');
    reward.innerHTML = `<span class="reward-badge">${escapeHtml(badge)}</span><span>${escapeHtml(text)}</span>`;
    document.body.appendChild(reward);
    setTimeout(() => reward.classList.add('out'), 2400);
    setTimeout(() => reward.remove(), 2750);
  };

  const showSparks = () => {
    for (const old of document.querySelectorAll('.sparks')) old.remove();
    const host = document.createElement('div');
    host.className = 'sparks';
    const seed = Date.now() % 97;
    for (let index = 0; index < 16; index++) {
      const angle = -Math.PI * (0.1 + 0.8 * (index / 15));
      const distance = 80 + ((index * 37 + seed * 13) % 90);
      const size = 6 + (index % 3) * 3;
      const spark = document.createElement('span');
      spark.className = 'spark';
      spark.style.cssText = `--dx: ${Math.round(Math.cos(angle) * distance)}px; --dy: ${Math.round(Math.sin(angle) * distance) - 24}px; --rot: ${(index * 67) % 360}deg; width: ${size}px; height: ${size}px; background: ${SPARK_COLORS[index % 4]}; animation-delay: ${(index % 4) * 35}ms`;
      host.appendChild(spark);
    }
    document.body.appendChild(host);
    setTimeout(() => host.remove(), 1600);
  };

  const rewardFor = (row, waitedMinutes, combo) => {
    if (combo >= 2) return [`🔥 Combo x${combo}`, `${row.title} repart en mission`];
    if (waitedMinutes >= 60) return ['🛟 Sauvetage', `${row.title} n'attend plus`];
    if (waitedMinutes < 5) return ['⚡ Éclair', 'Ordre donné en moins de 5 min'];
    return ['🚀 +1', `${row.title} repart en mission`];
  };

  const celebrateSend = row => {
    const now = Date.now();
    const stats = readStats();
    const combo = now - stats.lastSendAt < 60000 ? stats.combo + 1 : 1;
    const waitedMinutes = Math.floor((now - row.updatedAt) / 60000);
    stats.relaunched += 1;
    stats.record = Math.max(stats.record, stats.relaunched);
    stats.lastSendAt = now;
    stats.combo = combo;
    writeStats(stats);
    const [badge, text] = rewardFor(row, waitedMinutes, combo);
    showSparks();
    showReward(badge, text);
    renderStats({ bump: true });
    state.popId = row.engineId;
    setTimeout(() => {
      if (state.popId !== row.engineId) return;
      state.popId = null;
      render({ force: true });
    }, 900);
  };

  const notifyNewWaiting = rows => {
    if (isMini) return;
    const waiting = new Map(rows.filter(row => WAITING_STATUSES.includes(row.status)).map(row => [row.engineId, row]));
    const snapshot = new Map([...waiting].map(([id, row]) => [id, row.updatedAt]));
    if (state.knownWaiting === null) { state.knownWaiting = snapshot; return; }
    const fresh = [...waiting.values()].filter(row => state.knownWaiting.get(row.engineId) !== row.updatedAt);
    state.knownWaiting = snapshot;
    if (fresh.length === 0 || !('Notification' in window) || Notification.permission !== 'granted' || document.hasFocus()) return;
    for (const row of fresh) {
      const notification = new Notification(`${KINDS[kindOf(row)].emoji} ${row.title}`, { body: awaitingOf(row) || 'attend tes ordres', tag: row.engineId });
      notification.onclick = () => { window.focus(); expand(row.engineId); };
    }
  };

  const updateBell = () => {
    const bell = document.getElementById('bell');
    const granted = 'Notification' in window && Notification.permission === 'granted';
    bell.classList.toggle('on', granted);
    const label = granted ? 'Notifications activées' : 'Activer les notifications';
    bell.setAttribute('aria-label', label);
    bell.title = label;
  };

  const loadData = () => new Promise(resolve => {
    const script = document.createElement('script');
    script.src = `${DATA_FILE}?t=${Date.now()}`;
    script.onload = () => { script.remove(); resolve(true); };
    script.onerror = () => { script.remove(); resolve(false); };
    document.head.appendChild(script);
  });

  const isPageOutdated = () => {
    const served = state.data && state.data.pageVersion;
    const mine = window.__PAGE_VERSION__;
    return Boolean(served && mine && served !== mine);
  };

  const refresh = async () => {
    const isLoaded = await loadData();
    if (!isLoaded && isLocalFile) {
      if (!isTyping() && state.expanded.size === 0) location.reload();
      return;
    }
    if (window.__CONVERSATIONS__) state.data = withOptimisticWorking(window.__CONVERSATIONS__);
    if (isPageOutdated() && !isTyping() && state.expanded.size === 0 && state.bigId === null && state.teamPopId === null && state.newConv === null) {
      location.reload();
      return;
    }
    notifyNewWaiting(state.data.rows);
    render();
  };

  const post = async (path, payload) => {
    const response = await fetch(`${serverBase}${path}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) });
    if (response.ok) return;
    const body = await response.text();
    let reason = `HTTP ${response.status}`;
    try { reason = JSON.parse(body).error || reason; } catch { }
    throw new Error(reason);
  };

  const setFeedback = (engineId, text, isError = false) => {
    state.feedback.set(engineId, { text, isError });
    render({ force: true });
    setTimeout(() => { state.feedback.delete(engineId); render({ force: true }); }, 6000);
  };

  const rowOf = engineId => state.data.rows.find(row => row.engineId === engineId);

  const requestSummary = async engineId => {
    state.requestedSummaries.add(engineId);
    render({ force: true });
    try {
      await post('/summarize', { engineId });
    } catch (error) {
      state.requestedSummaries.delete(engineId);
      setFeedback(engineId, `Résumé impossible : ${error.message}`, true);
    }
  };

  const setSeen = async (engineId, seen) => {
    const title = rowOf(engineId)?.title || 'Cet agent';
    try {
      await post('/ack', { engineId, seen });
      state.expanded.delete(engineId);
      if (state.teamPopId === engineId) state.teamPopId = null;
      if (state.bigId === engineId) { state.bigId = null; syncBackdrop(); }
      render({ force: true });
      showReward(seen ? '👁️ Au repos' : '🙋 En attente', seen ? `${title} est mis au repos` : `${title} attend de nouveau tes ordres`, 'info');
    } catch (error) {
      showReward('Oups', error.message, 'error');
    }
  };

  const reposOf = row => (row.summary && Array.isArray(row.summary.repos) ? row.summary.repos : []);

  const launchTerminal = async folder => {
    closeRepoMenu();
    try {
      await post('/terminal', { cwd: folder });
      showReward('🖥️ Terminal', folderOf(folder), 'info');
    } catch (error) {
      showReward('Terminal non ouvert', error.message, 'error');
    }
  };

  const closeRepoMenu = () => {
    for (const menu of document.querySelectorAll('.repo-menu')) menu.remove();
  };

  const showRepoMenu = (anchor, row, repos) => {
    closeRepoMenu();
    const menu = document.createElement('div');
    menu.className = 'repo-menu';
    menu.setAttribute('role', 'menu');
    const items = repos.map(repo => `<button type="button" class="repo-item" role="menuitem" data-folder="${escapeHtml(repo)}"><span class="repo-name">${escapeHtml(folderOf(repo))}</span><span class="repo-path">${escapeHtml(repo)}</span></button>`).join('');
    const origin = `<button type="button" class="repo-item muted" role="menuitem" data-folder="${escapeHtml(row.cwd)}"><span class="repo-name">Dossier d'ouverture</span><span class="repo-path">${escapeHtml(row.cwd)}</span></button>`;
    menu.innerHTML = `<div class="repo-title">Ouvrir un terminal dans…</div>${items}${origin}`;
    document.body.appendChild(menu);
    const box = anchor.getBoundingClientRect();
    const left = Math.min(window.innerWidth - menu.offsetWidth - 12, Math.max(12, box.right - menu.offsetWidth));
    const below = box.bottom + 6;
    const top = below + menu.offsetHeight > window.innerHeight - 12 ? box.top - menu.offsetHeight - 6 : below;
    menu.style.left = `${left}px`;
    menu.style.top = `${Math.max(12, top)}px`;
    menu.querySelector('.repo-item')?.focus();
  };

  const openTerminal = (engineId, anchor) => {
    const row = rowOf(engineId);
    if (!row || !row.cwd) return;
    const repos = reposOf(row);
    if (repos.length === 0) { launchTerminal(row.cwd); return; }
    if (repos.length === 1) { launchTerminal(repos[0]); return; }
    showRepoMenu(anchor, row, repos);
  };

  const sendReply = async engineId => {
    const row = rowOf(engineId);
    const draft = draftOf(engineId);
    const text = draft.text.trim();
    if (!row || (text.length === 0 && draft.images.length === 0)) return;
    try {
      const images = draft.images.map(image => ({ type: image.type, base64: image.base64 }));
      await post('/reply', { engineId, text, images });
      state.sentAt.set(engineId, Date.now());
      state.drafts.delete(engineId);
      state.expanded.delete(engineId);
      if (state.bigId === engineId) { state.bigId = null; syncBackdrop(); }
      if (state.teamPopId === engineId) state.teamPopId = null;
      state.data = withOptimisticWorking(state.data);
      celebrateSend(row);
      render({ force: true });
    } catch (error) {
      setFeedback(engineId, `Non envoyé : ${error.message}`, true);
      showReward('Non envoyé', `${row.title} : ${error.message}`, 'error');
    }
  };

  const readImage = file => new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => {
      const url = String(reader.result);
      resolve({ type: file.type || 'image/png', base64: url.split(',')[1], url });
    };
    reader.readAsDataURL(file);
  });

  const keepInView = engineId => {
    const card = document.querySelector(`[data-engine="${engineId}"]:not(.big)`);
    if (!card) return;
    const top = card.getBoundingClientRect().top;
    if (top < 0 || top > window.innerHeight - 80) window.scrollBy({ top: top - 80, behavior: 'smooth' });
  };

  const syncBackdrop = () => {
    let backdrop = document.querySelector('.backdrop');
    if (state.bigId === null) {
      if (backdrop) backdrop.remove();
      document.body.style.overflow = '';
      return;
    }
    if (!backdrop) {
      backdrop = document.createElement('div');
      backdrop.className = 'backdrop';
      backdrop.addEventListener('click', () => toggleBig(state.bigId));
      document.body.appendChild(backdrop);
    }
    document.body.style.overflow = 'hidden';
  };

  const expand = (engineId, { focus = true } = {}) => {
    state.expanded.add(engineId);
    state.pendingBottom.add(engineId);
    if (focus) state.focusDraft = engineId;
    render({ force: true });
    keepInView(engineId);
    if (!isServer) return;
    const row = rowOf(engineId);
    const needsSummary = row && !ACTIVE_STATUSES.includes(row.status) && !isSummaryFresh(row);
    if (needsSummary) requestSummary(engineId);
  };

  const collapse = engineId => {
    if (state.bigId === engineId) { state.bigId = null; syncBackdrop(); }
    state.expanded.delete(engineId);
    render({ force: true });
    keepInView(engineId);
  };

  const toggle = engineId => (state.expanded.has(engineId) ? collapse(engineId) : expand(engineId));

  const toggleBig = engineId => {
    if (state.bigId === engineId) {
      state.bigId = null;
    } else {
      state.bigId = engineId;
      state.expanded.add(engineId);
      state.pendingBottom.add(engineId);
    }
    render({ force: true });
    syncBackdrop();
  };

  document.addEventListener('click', event => {
    const parkMenu = event.target.closest('.park-menu');
    if (parkMenu) {
      const chip = event.target.closest('.park-chip');
      if (chip) { submitPark(parkMenu.dataset.engine, parkMenu.dataset.kind, chip.dataset.reason); return; }
      if (event.target.closest('.park-ok')) { submitPark(parkMenu.dataset.engine, parkMenu.dataset.kind, parkMenu.querySelector('.park-input').value.trim()); return; }
      if (event.target.closest('.park-cancel')) closeParkMenu();
      return;
    }
    if (!event.target.closest('[data-action="park"]')) closeParkMenu();
    const repoItem = event.target.closest('.repo-item');
    if (repoItem) { launchTerminal(repoItem.dataset.folder); return; }
    if (!event.target.closest('.repo-menu') && !event.target.closest('[data-action="terminal"]')) closeRepoMenu();
    const avatar = event.target.closest('[data-av]');
    if (avatar) {
      const row = rowOf(avatar.dataset.av);
      if (!row || !WAITING_STATUSES.includes(row.status)) return;
      expand(row.engineId);
      document.querySelector(`.card[data-engine="${row.engineId}"]`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
      return;
    }
    if (event.target.closest('a')) return;
    const button = event.target.closest('[data-action]');
    const holder = event.target.closest('[data-engine]');
    if (!button || !holder) return;
    const engineId = holder.dataset.engine;
    const action = button.dataset.action;
    if (action === 'team-open') { openTeamPopup(engineId); return; }
    if (action === 'team-close') { closeTeamPopup(); return; }
    if (action === 'toggle') toggle(engineId);
    if (action === 'send') sendReply(engineId);
    if (action === 'summarize') requestSummary(engineId);
    if (action === 'seen') setSeen(engineId, true);
    if (action === 'unseen') setSeen(engineId, false);
    if (action === 'terminal') openTerminal(engineId, button);
    if (action === 'park') { const row = rowOf(engineId); if (row) showParkMenu(button, row, button.dataset.kind); }
    if (action === 'unpark') unpark(engineId);
    if (action === 'big') toggleBig(engineId);
    if (action === 'exact') {
      if (state.exactThreads.has(engineId)) {
        state.exactThreads.delete(engineId);
      } else {
        state.exactThreads.add(engineId);
        state.pendingBottom.add(engineId);
      }
      render({ force: true });
    }
    if (action === 'quick') {
      const draft = draftOf(engineId);
      draft.text = button.dataset.text;
      draft.images = [];
      sendReply(engineId);
    }
    if (action === 'remove-image') {
      draftOf(engineId).images.splice(Number(button.dataset.index), 1);
      render({ force: true });
    }
  });

  document.addEventListener('click', event => {
    const viewButton = event.target.closest('.view-switch [data-view]');
    if (viewButton) { applyView(viewButton.dataset.view); render({ force: true }); return; }
    if (event.target.closest('[data-action="team-rest"]')) { state.othersOpen = !state.othersOpen; render({ force: true }); }
  });

  document.getElementById('rest-toggle').addEventListener('click', () => {
    state.othersOpen = !state.othersOpen;
    render({ force: true });
  });

  document.addEventListener('input', event => {
    if (!event.target.matches('[data-role="draft"]')) return;
    const card = event.target.closest('[data-engine]');
    draftOf(card.dataset.engine).text = event.target.value;
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Enter' && event.target.matches && event.target.matches('.park-input')) {
      event.preventDefault();
      const menu = event.target.closest('.park-menu');
      submitPark(menu.dataset.engine, menu.dataset.kind, event.target.value.trim());
      return;
    }
    if (event.key === 'Escape' && document.querySelector('.repo-menu')) {
      event.preventDefault();
      event.stopImmediatePropagation();
      closeRepoMenu();
      closeParkMenu();
      return;
    }
    if (event.key === 'Enter' && (event.ctrlKey || event.metaKey) && event.target.id === 'nc-text') {
      event.preventDefault();
      submitNewConv();
      return;
    }
    if (event.key === 'Escape' && state.newConv !== null) {
      event.preventDefault();
      event.stopImmediatePropagation();
      closeNewConv();
      return;
    }
    if (event.key === 'Escape' && state.teamPopId !== null && !document.querySelector('.park-menu')) {
      event.preventDefault();
      event.stopImmediatePropagation();
      closeTeamPopup();
      return;
    }
    if (event.key !== 'Escape' || state.bigId === null) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    toggleBig(state.bigId);
  }, true);

  document.addEventListener('keydown', event => {
    if (!event.target.matches('[data-role="draft"]')) return;
    const card = event.target.closest('[data-engine]');
    if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      sendReply(card.dataset.engine);
    }
    if (event.key === 'Escape' && state.teamPopId === null) {
      event.target.blur();
      collapse(card.dataset.engine);
    }
  });

  document.addEventListener('paste', async event => {
    if (!event.target.matches('textarea[data-role="draft"]')) return;
    const files = [...(event.clipboardData?.items || [])].filter(item => item.kind === 'file' && item.type.startsWith('image/')).map(item => item.getAsFile());
    if (files.length === 0) return;
    event.preventDefault();
    const card = event.target.closest('[data-engine]');
    const draft = draftOf(card.dataset.engine);
    draft.text = event.target.value;
    for (const file of files) draft.images.push(await readImage(file));
    state.focusDraft = card.dataset.engine;
    render({ force: true });
  });

  document.addEventListener('focusout', event => {
    if (event.target.matches && event.target.matches('[data-role="draft"]')) setTimeout(() => render(), 50);
  });

  const readZoom = () => { try { return Number(localStorage.getItem(ZOOM_KEY)) || 1; } catch { return 1; } };
  const applyZoom = value => {
    const clamped = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(value * 100) / 100));
    document.documentElement.style.setProperty('--zoom', String(clamped));
    try { localStorage.setItem(ZOOM_KEY, String(clamped)); } catch { }
    return clamped;
  };
  let zoom = applyZoom(readZoom());
  document.getElementById('zoom-in').addEventListener('click', () => { zoom = applyZoom(zoom + ZOOM_STEP); });
  document.getElementById('zoom-out').addEventListener('click', () => { zoom = applyZoom(zoom - ZOOM_STEP); });

  document.getElementById('bell').addEventListener('click', async () => {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') await Notification.requestPermission();
    updateBell();
  });

  if (isMini) {
    document.documentElement.classList.add('mini-mode');
    document.body.classList.add('mini-mode');
    window.addEventListener('resize', () => syncDesktopWindow());
    document.addEventListener('mouseover', event => {
      const inside = Boolean(event.target.closest && event.target.closest('.dock, .t-sheet, .repo-menu'));
      if (inside === miniInside) return;
      miniInside = inside;
      if (desktop) desktop.setClickThrough(!inside);
    });
    document.addEventListener('click', event => {
      const appLink = desktop && event.target.closest('a[href^="claude:"]');
      if (appLink) {
        event.preventDefault();
        desktop.openLink(appLink.href);
        return;
      }
      const control = event.target.closest('[data-mini]');
      if (!control) return;
      if (control.dataset.mini === 'cockpit') { if (desktop) desktop.openCockpit(); else window.open('/', 'cockpit'); }
      if (control.dataset.mini === 'quit' && desktop) desktop.quit();
    });
  }
  else applyView(readView());
  document.getElementById('banner').classList.toggle('show', !isServer);
  updateBell();
  renderStats();
  tickClock();
  setInterval(tickClock, 1000);
  setInterval(tickAges, 1000);
  render({ force: true });
  tickAges();
  notifyNewWaiting(state.data.rows);
  setInterval(refresh, 3000);
</script>
</body>
</html>
